name: Deploy GitHub Pages from release

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      revision:
        type: string
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy verified release artifact
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: actions/download-artifact@v4
        with:
          name: standard-web
          path: dist

      - name: Verify release identity
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_REVISION: ${{ inputs.revision }}
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const build = JSON.parse(readFileSync("dist/build-info.json", "utf8"));
            assert.equal(process.env.GITHUB_REF, "refs/tags/v" + process.env.EXPECTED_VERSION);
            assert.equal(build.version, process.env.EXPECTED_VERSION);
            assert.equal(build.revision, process.env.EXPECTED_REVISION);
            assert.equal(build.edition, "standard");
          '

      - uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
