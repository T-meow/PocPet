name: Deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      source:
        description: Deploy a published release or the requested main commit
        type: choice
        options:
          - release
          - main
        default: release
        required: true
      version:
        description: Version to deploy
        type: string
        required: true
      revision:
        description: Exact commit to deploy
        type: string
        required: true
      run_id:
        description: Release workflow run containing standard-web
        type: string
        required: false

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy verified standard edition
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source == 'main' && inputs.revision || format('refs/tags/v{0}', inputs.version) }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify published release and source run
        if: inputs.source == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_REVISION: ${{ inputs.revision }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source-run.json
          gh release view "v$EXPECTED_VERSION" --json isDraft,tagName > source-release.json
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            import { execFileSync } from "node:child_process";
            const run = JSON.parse(readFileSync("source-run.json", "utf8"));
            const release = JSON.parse(readFileSync("source-release.json", "utf8"));
            const tag = "v" + process.env.EXPECTED_VERSION;
            assert.equal(process.env.GITHUB_REF, "refs/heads/main");
            assert.equal(run.path, ".github/workflows/release.yml");
            assert.equal(run.event, "push");
            assert.equal(run.head_branch, tag);
            assert.equal(run.head_sha, process.env.EXPECTED_REVISION);
            assert.equal(execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim(), process.env.EXPECTED_REVISION);
            assert.equal(release.tagName, tag);
            assert.equal(release.isDraft, false);
          '

      - uses: actions/download-artifact@v4
        if: inputs.source == 'release'
        with:
          name: standard-web
          path: dist
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify requested main commit
        if: inputs.source == 'main'
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_REVISION: ${{ inputs.revision }}
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            import { execFileSync } from "node:child_process";
            assert.equal(process.env.GITHUB_REF, "refs/heads/main");
            assert.equal(process.env.GITHUB_SHA, process.env.EXPECTED_REVISION);
            assert.equal(execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim(), process.env.EXPECTED_REVISION);
            assert.equal(JSON.parse(readFileSync("package.json", "utf8")).version, process.env.EXPECTED_VERSION);
          '

      - name: Build requested main commit
        if: inputs.source == 'main'
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmmirror.com/
        run: |
          npm ci
          npm run check:release
          npm run build
          node scripts/check-release.mjs --dist dist

      - name: Verify deployed build identity
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_REVISION: ${{ inputs.revision }}
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const build = JSON.parse(readFileSync("dist/build-info.json", "utf8"));
            assert.equal(build.version, process.env.EXPECTED_VERSION);
            assert.equal(build.revision, process.env.EXPECTED_REVISION);
            assert.equal(build.edition, "standard");
          '

      - uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
