name: PocPet CI and Release

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  NPM_CONFIG_REGISTRY: https://registry.npmmirror.com/

jobs:
  validate:
    name: Save safety, module loading and both editions
    if: github.event_name != 'release'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Check saves, errors and versions
        run: |
          npm test
          npm run check:release
      - name: Build both editions
        run: |
          npm run build
          node scripts/check.mjs --release --dist dist
          npm run build:toy
          node scripts/check.mjs --release --dist dist-toy --edition bilibili

  pages:
    name: Deploy the locally packaged release
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Start Pages deployment from main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          revision="$(git rev-parse HEAD)"
          gh workflow run pages.yml --ref main -f source=release -f version="$version" -f revision="$revision"
